name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "${{ matrix.python }}" }
      - run: uv sync
      - run: uv run pytest -q
  react:
    name: genui-react
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/genui-react } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm, cache-dependency-path: packages/genui-react/package-lock.json }
      - run: npm ci
      - run: npm run build # the tests import the built package (dist/)
      - run: npm run typecheck
      - run: npm test
  wander:
    name: wander backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/wander/backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - run: uv run pytest -q
