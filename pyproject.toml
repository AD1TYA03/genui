[project]
name = "genui-py"
version = "0.1.1"
description = "Generative UI for Python agents. Stream OpenUI Lang to any React frontend — free, self-hosted, zero telemetry."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aditya Kumar Singh" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["generative-ui", "llm", "agents", "openui", "ag-ui", "react", "fastapi", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
all = ["genui-py[fastapi,openai,anthropic]"]

[project.urls]
Homepage = "https://github.com/AD1TYA03/genui"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fastapi>=0.110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.build-backend]
module-name = "genui"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
