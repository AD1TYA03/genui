<!doctype html>
<html lang="en">
  <head>
    <!-- crypto.randomUUID only exists on https/localhost; the chat needs it on LAN http too. -->
    <script>if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16));</script>
    <!-- Keep OpenUI's dev-only Inspect widget from auto-mounting. -->
    <script>globalThis[Symbol.for("openui.devtools.autoMount")] = true;</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Wander — your concierge for extraordinary stays</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
